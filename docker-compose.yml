services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospedagens
      POSTGRES_PASSWORD: hospedagens
      POSTGRES_DB: hospedagens
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospedagens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
